<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Bridge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a; color: #e0e0e0; line-height: 1.5; padding: 1rem;
    }
    h1 { font-size: 1.25rem; margin-bottom: 0.25rem; }
    .sub { color: #888; font-size: 0.8rem; margin-bottom: 1rem; }
    .badge {
      display: inline-block; padding: 0.3rem 0.9rem; border-radius: 1rem;
      font-weight: 600; font-size: 0.95rem; margin-bottom: 1rem;
    }
    .ok { background: #2e7d32; color: #fff; }
    .bad { background: #c62828; color: #fff; }
    .warn { background: #f9a825; color: #1a1a1a; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.75rem; margin-bottom: 1rem;
    }
    .card {
      background: #262626; border: 1px solid #333; border-radius: 8px; padding: 0.75rem 0.9rem;
    }
    .card .label { color: #9e9e9e; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .card .value { font-size: 1.05rem; margin-top: 0.2rem; word-break: break-all; }
    .row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    button {
      background: #333; color: #e0e0e0; border: 1px solid #444; border-radius: 6px;
      padding: 0.4rem 0.8rem; cursor: pointer; font-size: 0.85rem;
    }
    button:hover { background: #3d3d3d; }
    .muted { color: #777; font-size: 0.78rem; }
  </style>
</head>
<body>
  <h1>MCP Bridge</h1>
  <div class="sub">Super Productivity &harr; MCP server bridge</div>

  <div class="row">
    <span id="badge" class="badge warn">Checking…</span>
    <button id="refresh">Refresh</button>
    <span id="updated" class="muted"></span>
  </div>

  <div class="grid" id="grid"></div>
  <div class="muted" id="err"></div>

  <script>
    // Hardcoded to match the plugin's socket port (PORT=3996 in the server .env).
    var STATS_URL = 'http://127.0.0.1:3996/stats';
    var POLL_MS = 2000;

    function fmtTime(ts) {
      if (!ts) return '—';
      try { return new Date(ts).toLocaleString(); } catch (e) { return String(ts); }
    }
    function fmtDur(ms) {
      if (ms == null) return '—';
      var s = Math.floor(ms / 1000);
      var d = Math.floor(s / 86400); s -= d * 86400;
      var h = Math.floor(s / 3600); s -= h * 3600;
      var m = Math.floor(s / 60); s -= m * 60;
      var out = [];
      if (d) out.push(d + 'd');
      if (h) out.push(h + 'h');
      if (m) out.push(m + 'm');
      out.push(s + 's');
      return out.join(' ');
    }
    function card(label, value) {
      return '<div class="card"><div class="label">' + label +
        '</div><div class="value">' + value + '</div></div>';
    }

    function render(s) {
      var badge = document.getElementById('badge');
      if (s.connected) {
        badge.className = 'badge ok';
        badge.textContent = 'Plugin connected';
      } else {
        badge.className = 'badge bad';
        badge.textContent = 'Plugin disconnected';
      }
      var version = s.lastStartup && s.lastStartup.version ? s.lastStartup.version : '—';
      var hooks = s.lastHooks && Array.isArray(s.lastHooks.ok) ? s.lastHooks.ok.join(', ') : '—';
      var hookErrs = s.lastHooks && s.lastHooks.err ? Object.keys(s.lastHooks.err).length : 0;
      document.getElementById('grid').innerHTML =
        card('Plugin version', version) +
        card('Hooks registered', hooks + (hookErrs ? ' (' + hookErrs + ' err)' : '')) +
        card('Commands processed', s.commandCount != null ? s.commandCount : '—') +
        card('Connected since', fmtTime(s.connectedAt)) +
        card('Last heartbeat', fmtTime(s.lastStartupAt)) +
        card('Server uptime', fmtDur(s.uptimeMs)) +
        card('Socket ID', s.socketId || '—') +
        card('Server port', s.port != null ? s.port : '—');
      document.getElementById('err').textContent = '';
    }

    function renderUnreachable(msg) {
      var badge = document.getElementById('badge');
      badge.className = 'badge bad';
      badge.textContent = 'Server unreachable';
      document.getElementById('grid').innerHTML =
        card('Status', 'Cannot reach MCP server at ' + STATS_URL);
      document.getElementById('err').textContent = msg || '';
    }

    function poll() {
      fetch(STATS_URL, { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (s) {
          render(s);
          document.getElementById('updated').textContent =
            'updated ' + new Date().toLocaleTimeString();
        })
        .catch(function (e) {
          renderUnreachable(e && e.message ? e.message : String(e));
          document.getElementById('updated').textContent =
            'last try ' + new Date().toLocaleTimeString();
        });
    }

    document.getElementById('refresh').addEventListener('click', poll);
    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>
